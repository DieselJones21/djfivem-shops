<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Shops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="preview-bar" id="previewBar" aria-label="Theme preview">
        <button type="button" data-preview="chrome">Chrome</button>
        <button type="button" data-preview="lava">Lava</button>
        <button type="button" data-preview="vice">Vice</button>
        <button type="button" data-preview="gold">Gold</button>
        <button type="button" data-preview="ice">Ice</button>
        <button type="button" data-preview="sunset">Sunset</button>
    </div>
    <div id="app" class="hidden" aria-hidden="true">
        <div class="shell">
            <header class="topbar">
                <div class="brand">
                    <img class="brand-logo" id="brandLogo" src="img/dj-fivem-scripts.webp" alt="DJ FiveM Scripts" />
                    <div>
                        <h1 id="shopName">Shop</h1>
                        <p id="shopSubtitle">Store</p>
                    </div>
                </div>

                <nav class="tabs" id="tabs"></nav>

                <div class="profile">
                    <div class="profile-text">
                        <strong id="playerName">Customer</strong>
                        <span>Customer</span>
                    </div>
                    <div class="avatar" id="avatar">C</div>
                </div>
            </header>

            <section class="stats">
                <article class="stat-card">
                    <span class="stat-label">Cash On Hand</span>
                    <div class="stat-row">
                        <strong id="statCash">$0</strong>
                        <span class="stat-badge">Wallet</span>
                    </div>
                </article>
                <article class="stat-card">
                    <span class="stat-label">Bank Balance</span>
                    <div class="stat-row">
                        <strong id="statBank">$0</strong>
                        <span class="stat-badge">Account</span>
                    </div>
                </article>
                <article class="stat-card">
                    <span class="stat-label">Cart Total</span>
                    <div class="stat-row">
                        <strong id="statCart">$0</strong>
                        <span class="stat-badge" id="cartCountPill">0 items</span>
                    </div>
                </article>
            </section>

            <section class="workspace">
                <div class="catalog-panel">
                    <div class="panel-head">
                        <div>
                            <h2>Catalog</h2>
                            <p id="categoryHint">Browse available products</p>
                        </div>
                        <div class="head-actions">
                            <label class="search">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2z"/></svg>
                                <input id="search" type="search" placeholder="Search items" autocomplete="off" />
                            </label>
                            <div class="pills" id="paymentPills"></div>
                        </div>
                    </div>
                    <div class="grid" id="grid"></div>
                    <p class="empty hidden" id="empty">No items in this category.</p>
                </div>

                <aside class="cart-panel">
                    <div class="panel-head">
                        <div>
                            <h2>Cart</h2>
                            <p>Review and checkout</p>
                        </div>
                    </div>
                    <div class="cart-list" id="cartList"></div>
                    <p class="empty" id="cartEmpty">Your cart is empty.</p>
                    <div class="checkout">
                        <div class="checkout-row">
                            <span>Method</span>
                            <strong id="methodLabel">Cash</strong>
                        </div>
                        <div class="checkout-row total">
                            <span>Total</span>
                            <strong id="checkoutTotal">$0</strong>
                        </div>
                        <button id="checkoutBtn" class="buy-btn" type="button" disabled>Checkout</button>
                    </div>
                </aside>
            </section>

            <footer class="hint">
                <span class="footer-brand" id="footerBrand">DJ FiveM Scripts</span>
                <span class="close-chip" id="closeHint">ESC (Close Shop)</span>
            </footer>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
